name: Build, test and scan
on: [push, pull_request]
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan reachable history with verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          version=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v${version}"
          curl -fsSLO "$base/gitleaks_${version}_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_${version}_checksums.txt"
          grep "gitleaks_${version}_linux_x64.tar.gz$" "gitleaks_${version}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${version}_linux_x64.tar.gz" gitleaks
          ./gitleaks git . --redact=100 --log-opts=--all
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pdf-summarizer-backend/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-fas tesseract-ocr-ara
      - run: python -m pip install -r requirements-dev.txt
        working-directory: pdf-summarizer-backend
      - run: python -m pytest tests -q --cov=app
        working-directory: pdf-summarizer-backend
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: documind-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: documind-web/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Browser regression tests
        run: |
          npm run start -- --port 4317 > /tmp/documind-next.log 2>&1 &
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:4317/ >/dev/null && break || sleep 1; done
          npm run test:e2e
