services:
  qdrant_service:
    image: qdrant/qdrant:latest
    container_name: documind_qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped

  pdf_backend:
    build:
      context: ./pdf-summarizer-backend
      dockerfile: Dockerfile
    container_name: documind_backend
    ports:
      - "127.0.0.1:8888:8888"
    environment:
      - OLLAMA_API_URL=http://host.docker.internal:${DOCUMIND_OLLAMA_PORT:-11434}/api/chat
      - OLLAMA_BASE_URL=http://host.docker.internal:${DOCUMIND_OLLAMA_PORT:-11434}
      - OLLAMA_EMBED_URL=http://host.docker.internal:${DOCUMIND_OLLAMA_PORT:-11434}/api/embeddings
      - OLLAMA_TAGS_URL=http://host.docker.internal:${DOCUMIND_OLLAMA_PORT:-11434}/api/tags
      - OLLAMA_CHAT_MODEL=${OLLAMA_CHAT_MODEL:-llama3.2:3b}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - CHAT_MODEL=${OLLAMA_CHAT_MODEL:-llama3.2:3b}
      - EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - EMBED_VECTOR_DIM=${EMBED_VECTOR_DIM:-768}
      - DOCUMIND_QDRANT_COLLECTION=${DOCUMIND_QDRANT_COLLECTION:-pdf_chunks}
      - DOCUMIND_LOCAL_ONLY=${DOCUMIND_LOCAL_ONLY:-0}
      - HF_HUB_OFFLINE=${DOCUMIND_LOCAL_ONLY:-0}
      - HF_HUB_DISABLE_TELEMETRY=1
      - TRANSFORMERS_OFFLINE=${DOCUMIND_LOCAL_ONLY:-0}
      - DO_NOT_TRACK=1
      - QDRANT_HOST=http://qdrant_service:6333
      - QDRANT_PORT=6333
      - MAX_UPLOAD_MB=50
      - PDF_PROCESS_WORKERS=${PDF_PROCESS_WORKERS:-2}
      - PDF_MAX_PENDING=${PDF_MAX_PENDING:-8}
      - DB_URL=sqlite:////workspace/db_data/pdf_summarizer.db
      - DOCUMIND_RERANK_CACHE=/workspace/db_data/model_cache
    volumes:
      - ./pdf-summarizer-backend/app:/workspace/app
      - ./db_data:/workspace/db_data
      - ./uploaded_pdfs:/workspace/uploaded_pdfs
    depends_on:
      - qdrant_service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
